<div
  class="mascota"
  [class.mascota--inactivo]="estadoVisible() === 'inactivo'"
  [class.mascota--pensando]="estadoVisible() === 'pensando'"
  [class.mascota--hablando]="estadoVisible() === 'hablando'"
  [class.mascota--grande]="grande()"
  [class.mascota--saludando]="saludando()"
  role="img"
  [attr.aria-label]="etiquetaAccesible()"
>
  <div class="mascota__halo" aria-hidden="true"></div>
  @if (mensaje() && saludando()) {
    <div class="mascota__burbuja" aria-hidden="true">{{ mensaje() }}</div>
  }
  <div class="mascota__seguimiento" [style.transform]="desplazamiento()">
    <div class="mascota__animacion">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient [attr.id]="prefijo + '-pelaje'" cx="48%" cy="42%" r="58%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="68%" stop-color="#f1f5f9" />
            <stop offset="100%" stop-color="#cbd5e1" />
          </radialGradient>
          <radialGradient [attr.id]="prefijo + '-mejilla'" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.75" />
            <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0" />
          </radialGradient>
          <linearGradient [attr.id]="prefijo + '-oreja'" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f4a28c" />
            <stop offset="100%" stop-color="#d9776c" />
          </linearGradient>
          <linearGradient [attr.id]="prefijo + '-audifono'" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7dd3fc" />
            <stop offset="45%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#1e3a8a" />
          </linearGradient>
          <radialGradient [attr.id]="prefijo + '-ojo'" cx="45%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="65%" stop-color="#059669" />
            <stop offset="100%" stop-color="#064e3b" />
          </radialGradient>
          <radialGradient [attr.id]="prefijo + '-nariz'" cx="40%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#475569" />
            <stop offset="45%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#090d16" />
          </radialGradient>
        </defs>

        <g class="mascota__anillo" opacity="0.45">
          <circle cx="150" cy="150" r="126" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 8" />
          <circle cx="150" cy="150" r="114" fill="none" stroke="#60a5fa" stroke-width="0.8" stroke-dasharray="22 10 3 10" />
        </g>

        <g class="mascota__particulas" aria-hidden="true">
          <circle class="mascota__particula" cx="28" cy="104" r="3.2" />
          <circle class="mascota__particula" cx="52" cy="52" r="2.4" />
          <circle class="mascota__particula" cx="150" cy="22" r="2.8" />
          <circle class="mascota__particula" cx="248" cy="52" r="2.4" />
          <circle class="mascota__particula" cx="274" cy="104" r="3.2" />
          <circle class="mascota__particula" cx="38" cy="214" r="2.2" />
        </g>

        <g class="mascota__cabeza" [style.transform]="cabeza()">
          <path d="M 56 142 C 56 58, 244 58, 244 142" fill="none" [attr.stroke]="'url(#' + prefijo + '-audifono)'" stroke-width="16" stroke-linecap="round" />
        <path d="M 66 132 C 74 68, 226 68, 234 132" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

        <g>
          <path d="M 96 86 C 58 46, 26 76, 44 122 C 52 142, 68 148, 82 142 Z" [attr.fill]="'url(#' + prefijo + '-pelaje)'" stroke="#cbd5e1" stroke-width="1.5" />
          <path d="M 88 92 C 62 66, 42 84, 54 116 C 60 130, 72 134, 80 128 Z" [attr.fill]="'url(#' + prefijo + '-oreja)'" />
        </g>
        <g>
          <path d="M 204 86 C 242 46, 274 76, 256 122 C 248 142, 232 148, 218 142 Z" [attr.fill]="'url(#' + prefijo + '-pelaje)'" stroke="#cbd5e1" stroke-width="1.5" />
          <path d="M 212 92 C 238 66, 258 84, 246 116 C 240 130, 228 134, 220 128 Z" [attr.fill]="'url(#' + prefijo + '-oreja)'" />
        </g>

        <path d="M 134 66 Q 144 42 152 58 Q 162 40 168 62 Q 176 52 174 70 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

        <path
          d="M 150 64 C 198 64, 228 96, 228 140 C 238 158, 236 190, 214 208 C 198 222, 178 242, 150 242 C 122 242, 102 222, 86 208 C 64 190, 62 158, 72 140 C 72 96, 102 64, 150 64 Z"
          [attr.fill]="'url(#' + prefijo + '-pelaje)'"
        />
        <ellipse cx="106" cy="184" rx="28" ry="20" [attr.fill]="'url(#' + prefijo + '-mejilla)'" />
        <ellipse cx="194" cy="184" rx="28" ry="20" [attr.fill]="'url(#' + prefijo + '-mejilla)'" />
        <path d="M 136 122 Q 150 130 164 122 L 160 168 L 140 168 Z" fill="#e2e8f0" opacity="0.45" />

        <g>
          <rect x="42" y="122" width="24" height="58" rx="12" [attr.fill]="'url(#' + prefijo + '-audifono)'" stroke="#0369a1" stroke-width="1.5" />
          <rect x="37" y="132" width="8" height="38" rx="4" fill="#38bdf8" />
          <line x1="41" y1="138" x2="41" y2="164" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
        </g>
        <g>
          <rect x="234" y="122" width="24" height="58" rx="12" [attr.fill]="'url(#' + prefijo + '-audifono)'" stroke="#0369a1" stroke-width="1.5" />
          <rect x="255" y="132" width="8" height="38" rx="4" fill="#38bdf8" />
          <line x1="259" y1="138" x2="259" y2="164" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
        </g>

        <g class="mascota__ojo">
          <ellipse cx="114" cy="146" rx="20" ry="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
          <g class="mascota__pupila mascota__pupila--izquierda" [style.transform]="mirada()">
            <circle cx="112" cy="147" r="13.5" [attr.fill]="'url(#' + prefijo + '-ojo)'" />
            <circle cx="112" cy="147" r="7.5" fill="#090d16" />
            <circle cx="107" cy="141" r="3.8" fill="#ffffff" />
            <circle cx="117" cy="152" r="1.6" fill="#ffffff" opacity="0.85" />
          </g>
          <path d="M 94 142 C 100 124, 128 124, 134 142" fill="none" stroke="#3b2314" stroke-width="6" stroke-linecap="round" />
          <g class="mascota__parpado mascota__parpado--izquierdo">
            <ellipse cx="114" cy="146" rx="21" ry="23" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
            <path d="M 93 146 Q 114 168 135 146" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />
          </g>
        </g>

        <g class="mascota__ojo">
          <ellipse cx="192" cy="146" rx="20" ry="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
          <g class="mascota__pupila mascota__pupila--derecha" [style.transform]="mirada()">
            <circle cx="190" cy="147" r="13.5" [attr.fill]="'url(#' + prefijo + '-ojo)'" />
            <circle cx="190" cy="147" r="7.5" fill="#090d16" />
            <circle cx="185" cy="141" r="3.8" fill="#ffffff" />
            <circle cx="195" cy="152" r="1.6" fill="#ffffff" opacity="0.85" />
          </g>
          <path d="M 172 142 C 178 124, 206 124, 212 142" fill="none" stroke="#3b2314" stroke-width="6" stroke-linecap="round" />
          <g class="mascota__parpado mascota__parpado--derecho">
            <ellipse cx="192" cy="146" rx="21" ry="23" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
            <path d="M 171 146 Q 192 168 213 146" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />
          </g>
        </g>

        <g class="mascota__boca">
          <path d="M 124 202 Q 150 232 176 202 Q 150 210 124 202 Z" fill="#1e1b18" />
          <path d="M 135 212 Q 150 205 165 212 Q 150 225 135 212 Z" fill="#fb7185" />
        </g>
        <path d="M 114 196 Q 134 208 150 194 Q 166 208 186 196" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

        <path d="M 134 172 C 134 164, 166 164, 166 172 C 166 181, 155 190, 150 190 C 145 190, 134 181, 134 172 Z" [attr.fill]="'url(#' + prefijo + '-nariz)'" />
        <ellipse cx="146" cy="170" rx="6" ry="2.2" fill="#94a3b8" opacity="0.65" />

        <circle cx="122" cy="186" r="1.3" fill="#64748b" />
        <circle cx="116" cy="191" r="1.3" fill="#64748b" />
        <circle cx="178" cy="186" r="1.3" fill="#64748b" />
        <circle cx="184" cy="191" r="1.3" fill="#64748b" />
        <path d="M 114 188 Q 84 184 56 192" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
        <path d="M 112 194 Q 82 195 58 206" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
        <path d="M 186 188 Q 216 184 244 192" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
        <path d="M 188 194 Q 218 195 242 206" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />

        <g class="mascota__pata">
          <path d="M 98 216 C 78 212, 60 224, 62 244 C 64 260, 84 262, 96 250 Z" [attr.fill]="'url(#' + prefijo + '-pelaje)'" stroke="#cbd5e1" stroke-width="1.5" />
          <path d="M 72 230 L 61 220 M 78 238 L 65 233 M 84 245 L 72 244" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
        </g>

        <g>
          <path d="M 248 176 C 248 214, 224 232, 194 232" fill="none" [attr.stroke]="'url(#' + prefijo + '-audifono)'" stroke-width="7.5" stroke-linecap="round" />
          <path d="M 246 178 C 246 212, 224 229, 196 229" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
          <rect x="174" y="222" width="24" height="17" rx="8.5" transform="rotate(-10 186 230)" fill="#1d4ed8" stroke="#38bdf8" stroke-width="1.5" />
          <circle class="mascota__microfono" cx="180" cy="231" r="3" fill="#38bdf8" />
        </g>
        </g>
      </svg>
    </div>
  </div>
</div>
