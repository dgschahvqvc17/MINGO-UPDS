AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Frontend estatico de MINGO en S3 privado + CloudFront (pay-as-you-go).
  Una sola distribucion, sin WAF, sin Lambda@Edge, sin Origin Shield,
  sin dominio propio y sin logs en tiempo real. Costo esperado: $0/mes
  dentro del Always Free de CloudFront (1 TB y 10 millones de peticiones).

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
    Description: Entorno del frontend. Por ahora solo se despliega dev.

  FrontendBucketName:
    Type: String
    Default: mingo-frontend-dev-591015654164
    Description: >
      Nombre unico del bucket privado que almacena el build de Angular.
      No es el bucket de documentos del backend.

  ApiDomainName:
    Type: String
    Default: ''
    Description: >
      Dominio de la API Gateway HTTP API (sin https://). Si se deja vacio no
      se crea el comportamiento /api/*. Se rellena despues de desplegar la API.

Conditions:
  TieneApi: !Not [!Equals [!Ref ApiDomainName, '']]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref FrontendBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortarCargasIncompletas
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - { Key: Project, Value: MINGO }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: equipo-mingo }
        - { Key: ManagedBy, Value: cloudformation }
        - { Key: CostCenter, Value: academico }

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend-oac'
        Description: Solo CloudFront puede leer el bucket del frontend.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PermitirSoloLecturaACloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Rutas del SPA a /index.html sin alterar /api/*
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          const uri = event.request.uri;
          if (uri.startsWith('/api') || uri.includes('.')) {
            return event.request;
          }
          event.request.uri = '/index.html';
          return event.request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: MINGO frontend estatico + API (dev) v3
        PriceClass: PriceClass_100
        IPV6Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - !If
            - TieneApi
            - Id: ApiOrigin
              DomainName: !Ref ApiDomainName
              CustomOriginConfig:
                HTTPPort: 80
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          # CachingOptimized respeta el Cache-Control del origen sin reenviar
          # cabeceras al bucket. UseOriginCacheControlHeaders devolvia 404
          # desde S3 con OAC; ver docs/entornos-y-despliegue.md.
          CachePolicyId: '658327ea-f89d-4fab-a63d-7e88639e58f6'
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors: !If
          - TieneApi
          - - PathPattern: /api/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: '4135ea2d-6df8-44a3-9df3-4b5a84be39ad'
              OriginRequestPolicyId: 'b689b0a8-53d0-40ab-baf2-68738e2966ac'
          - !Ref AWS::NoValue
      Tags:
        - { Key: Project, Value: MINGO }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: equipo-mingo }
        - { Key: ManagedBy, Value: cloudformation }
        - { Key: CostCenter, Value: academico }

Outputs:
  FrontendBucketName:
    Description: Bucket privado del build de Angular.
    Value: !Ref FrontendBucket
  DistributionId:
    Description: ID de la distribucion de CloudFront.
    Value: !Ref FrontendDistribution
  DistributionDomainName:
    Description: Dominio publico de CloudFront.
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendUrl:
    Description: URL publica del frontend.
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  ApiProxyPath:
    Description: Ruta de la API a traves de CloudFront (o vacia si no se configuro).
    Value: !If [TieneApi, '/api/*', '']
