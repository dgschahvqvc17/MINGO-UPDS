AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  MINGO - HU07, HU09 y HU18. Bucket privado de documentos academicos,
  procesamiento asincrono (S3 -> SQS -> Lambda) y recordatorios horarios
  (Scheduler -> Lambda -> SNS). Sin servidores, sin VPC, sin concurrencia
  provisionada y con DLQ acotada. Solo capa gratuita.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Entorno de MINGO.

  BucketName:
    Type: String
    Default: mingo-documentos
    Description: Nombre global del bucket de documentos.

  FrontendOrigin:
    Type: String
    Default: http://localhost:4200
    Description: >
      Origen exacto del frontend autorizado a subir por CORS.
      En produccion se reemplaza por el dominio del sitio.
    AllowedPattern: '^https?://[^/]+$'
    ConstraintDescription: Debe ser un origen sin ruta, por ejemplo https://mingo.example.com

  ProcessorConcurrency:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: >
      Concurrencia reservada del worker. 2 en dev y 5 en prod; nunca
      concurrencia provisionada.

  ApiConcurrency:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 10
    Description: >
      Concurrencia reservada de la Lambda de la API solo en prod. En dev se
      omite: la cuenta compartida no puede reservar concurrencia.

  CorsOrigins:
    Type: String
    Default: 'http://localhost:4200,https://d4qnw8e73f6co.cloudfront.net'
    Description: >
      Origenes autorizados por CORS en Express, separados por coma. El frontend
      desplegado llama a la API por el mismo origen de CloudFront.

  ApiRoleArn:
    Type: String
    Description: >
      ARN de un rol IAM existente para la Lambda de la API. Debe confiar en
      lambda.amazonaws.com, incluir AWSLambdaBasicExecutionRole y permitir
      s3:GetObject/PutObject/DeleteObject en el bucket de documentos,
      sqs:SendMessage en la cola de procesamiento y sns:Publish en el topic
      de notificaciones. MINGO no crea roles IAM.
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/.+$'
    ConstraintDescription: Debe ser el ARN de un rol IAM existente.

  SupabaseUrl:
    Type: String
    Description: URL del proyecto de Supabase.

  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Description: >
      Clave service_role para el worker. Se inyecta desde el pipeline o desde
      un parametro seguro; nunca se versiona en el repositorio.

  SupabaseAnonKey:
    Type: String
    NoEcho: true
    Description: >
      Clave anon de Supabase. El worker no la usa, pero la validacion de
      configuracion del backend la exige cuando NODE_ENV=production.

  AiApiKey:
    Type: String
    NoEcho: true
    Description: Clave del proveedor de IA. Se inyecta desde el pipeline.

  AiProvider:
    Type: String
    Default: openai
    AllowedValues: [gemini, openai]
    Description: >
      Proveedor compatible con OpenAI. Produccion usa openai porque su politica
      no entrena con los datos enviados; gemini se limita a desarrollo y demo
      con el tier gratuito, cuyo uso si puede usarse para entrenar.

  AiBaseUrl:
    Type: String
    Default: ''
    Description: >
      URL base opcional del proveedor compatible con OpenAI. En desarrollo con
      Gemini: https://generativelanguage.googleapis.com/v1beta/openai/

  AiEmbeddingModel:
    Type: String
    Default: text-embedding-3-small
    Description: >
      Modelo de embeddings; debe producir 1536 dimensiones. Con Gemini en
      desarrollo se usa gemini-embedding-001 con 1536 dimensiones de salida.

  AiEmbeddingDimensions:
    Type: Number
    Default: 1536
    AllowedValues: [1536]
    Description: >
      Dimension fija de la columna vector(1536). Cambiarla exige migracion y
      reprocesar todos los documentos.

  NotificacionesEmail:
    Type: String
    Default: ''
    Description: >
      Correo del suscriptor del unico topic SNS. Vacio desactiva el envio por
      email; la notificacion interna de la plataforma sigue funcionando.
    AllowedPattern: '^$|[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Debe ser un correo valido o una cadena vacia.

  RecordatorioCron:
    Type: String
    Default: 'cron(0 * * * ? *)'
    Description: >
      Expresion cron UTC del unico schedule. Por defecto se ejecuta cada hora
      en punto para cubrir vencimientos durante todo el dia (744 invocaciones
      al mes, dentro del free tier de 14 millones de EventBridge Scheduler).

  RecordatoriosRoleArn:
    Type: String
    Description: >
      ARN de un rol IAM existente para la Lambda de recordatorios. Debe confiar
      en lambda.amazonaws.com, incluir AWSLambdaBasicExecutionRole y permitir
      sns:Publish sobre el topic de notificaciones. MINGO no crea roles IAM.
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/.+$'
    ConstraintDescription: Debe ser el ARN de un rol IAM existente.

  SchedulerInvocationRoleArn:
    Type: String
    Description: >
      ARN de un rol IAM existente para que EventBridge Scheduler invoque la
      Lambda. Debe confiar en scheduler.amazonaws.com y permitir
      lambda:InvokeFunction sobre la funcion de recordatorios. MINGO no crea
      roles IAM.
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/.+$'
    ConstraintDescription: Debe ser el ARN de un rol IAM existente.

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  TieneCorreoNotificaciones: !Not [!Equals [!Ref NotificacionesEmail, '']]

Resources:
  DocumentosBucket:
    Type: AWS::S3::Bucket
    # La politica de la cola debe existir antes de configurar la notificacion.
    DependsOn: ProcesamientoQueuePolicy
    # Retain evita que un fallo de despliegue borre documentos de usuarios.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      # Sin ACLs: el propietario del bucket siempre posee los objetos.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Regla obligatoria: ningun acceso publico, ni por ACL ni por politica.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Sin versionado: evita almacenamiento duplicado con costo oculto.
      VersioningConfiguration:
        Status: Suspended
      # El navegador sube directo a S3 con la URL prefirmada: hace falta CORS.
      # Solo PUT desde el origen del frontend; no se exponen listados ni otros metodos.
      CorsConfiguration:
        CorsRules:
          - Id: subida-directa-desde-el-frontend
            AllowedOrigins:
              - !Ref FrontendOrigin
            AllowedMethods:
              - PUT
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: abortar-cargas-multipart-incompletas
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: limpiar-temporales
            Status: Enabled
            Prefix: tmp/
            ExpirationInDays: !If [IsProd, 3, 1]
      # Todo objeto subido bajo usuarios/ dispara el procesamiento asincrono.
      NotificationConfiguration:
        QueueConfigurations:
          - Event: 's3:ObjectCreated:*'
            Queue: !GetAtt ProcesamientoQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: usuarios/
      Tags:
        - { Key: Project, Value: MINGO }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: equipo-mingo }
        - { Key: ManagedBy, Value: cloudformation }
        - { Key: CostCenter, Value: academico }

  # Rechaza cualquier peticion sin TLS. Las URLs prefirmadas de la app ya usan HTTPS.
  DocumentosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DocumentosBucket.Arn
              - !Sub '${DocumentosBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ProcesamientoDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-procesamiento-dlq'
      MessageRetentionPeriod: 345600 # 4 dias
      Tags:
        - { Key: Project, Value: MINGO }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: equipo-mingo }
        - { Key: ManagedBy, Value: cloudformation }
        - { Key: CostCenter, Value: academico }

  ProcesamientoQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-procesamiento'
      MessageRetentionPeriod: 345600 # 4 dias
      VisibilityTimeout: 360 # mayor que el timeout de la Lambda (300 s)
      ReceiveMessageWaitTimeSeconds: 20 # long polling, sin bucles en vacio
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProcesamientoDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - { Key: Project, Value: MINGO }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: equipo-mingo }
        - { Key: ManagedBy, Value: cloudformation }
        - { Key: CostCenter, Value: academico }

  ProcesamientoQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProcesamientoQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PermitirNotificacionesDelBucket
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: 'sqs:SendMessage'
            Resource: !GetAtt ProcesamientoQueue.Arn
            Condition:
              # Se usa el nombre del parametro para evitar una dependencia
              # circular con el bucket que publica la notificacion.
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ProcesadorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-procesador'
      RetentionInDays: !If [IsProd, 30, 7]

  ProcesadorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: leer-documentos-y-consumir-cola
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 's3:GetObject'
                Resource: !Sub '${DocumentosBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - 'sqs:ReceiveMessage'
                  - 'sqs:DeleteMessage'
                  - 'sqs:GetQueueAttributes'
                  - 'sqs:ChangeMessageVisibility'
                Resource: !GetAtt ProcesamientoQueue.Arn
      Tags:
        - { Key: Project, Value: MINGO }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: equipo-mingo }
        - { Key: ManagedBy, Value: cloudformation }
        - { Key: CostCenter, Value: academico }

  ProcesadorFunction:
    # AWS::Serverless::Function permite que `sam build` empaquete CodeUri ../backend/.
    Type: AWS::Serverless::Function
    DependsOn: ProcesadorLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-procesador'
      Description: Extrae texto, fragmenta y genera embeddings de los documentos.
      CodeUri: ../backend/
      Handler: src/lambda/procesador.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 300
      # La cuenta compartida no puede reservar concurrencia en dev: AWS exige
      # dejar al menos 10 ejecuciones sin reservar y solo quedan 10. Ver
      # docs/excepciones-aws.md (aprobada 2026-11-18, revision 2027-02-18).
      ReservedConcurrentExecutions: !If [IsProd, !Ref ProcessorConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt ProcesadorRole.Arn
      Environment:
        Variables:
          NODE_ENV: production
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          SUPABASE_ANON_KEY: !Ref SupabaseAnonKey
          AWS_S3_BUCKET: !Ref BucketName
          AI_PROVIDER: !Ref AiProvider
          AI_API_KEY: !Ref AiApiKey
          AI_BASE_URL: !Ref AiBaseUrl
          AI_EMBEDDING_MODEL: !Ref AiEmbeddingModel
          AI_EMBEDDING_DIMENSIONS: !Ref AiEmbeddingDimensions
      Tags:
        Project: MINGO
        Environment: !Ref Environment
        Owner: equipo-mingo
        ManagedBy: sam
        CostCenter: academico

  ProcesadorEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ProcesamientoQueue.Arn
      FunctionName: !Ref ProcesadorFunction
      BatchSize: 5
      MaximumBatchingWindowInSeconds: 5
      FunctionResponseTypes:
        - ReportBatchItemFailures
      Enabled: true

  # --- HU18: recordatorios programados ---------------------------------------
  # Un solo topic para todos los avisos. Solo se publica si el estudiante
  # activo `canal_email`; el servicio limita el dia a 30 correos para no
  # superar los 1.000 correos/mes gratuitos de SNS email. Sin suscripcion
  # no se envia ningun correo.
  NotificacionesTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-notificaciones'
      DisplayName: MINGO-recordatorios
      Tags:
        - { Key: Project, Value: MINGO }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: equipo-mingo }
        - { Key: ManagedBy, Value: sam }
        - { Key: CostCenter, Value: academico }

  NotificacionesSuscripcion:
    Type: AWS::SNS::Subscription
    Condition: TieneCorreoNotificaciones
    Properties:
      Protocol: email
      TopicArn: !Ref NotificacionesTopic
      Endpoint: !Ref NotificacionesEmail
      # AWS::SNS::Subscription no expone la propiedad Tags en CloudFormation.
      # Las etiquetas obligatorias las lleva el topic, que es el recurso padre.

  RecordatoriosLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-recordatorios'
      RetentionInDays: !If [IsProd, 30, 7]
      Tags:
        - { Key: Project, Value: MINGO }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: equipo-mingo }
        - { Key: ManagedBy, Value: sam }
        - { Key: CostCenter, Value: academico }

  RecordatoriosFunction:
    Type: AWS::Serverless::Function
    DependsOn: RecordatoriosLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-recordatorios'
      Description: Genera recordatorios de tareas, evaluaciones y sesiones de estudio.
      CodeUri: ../backend/
      Handler: src/lambda/recordatorios.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 30
      # Una ejecucion por hora: sin concurrencia reservada ni provisionada.
      # El rol lo crea el usuario; MINGO solo lo referencia.
      Role: !Ref RecordatoriosRoleArn
      Environment:
        Variables:
          NODE_ENV: production
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          SUPABASE_ANON_KEY: !Ref SupabaseAnonKey
          AWS_SNS_TOPIC_ARN: !Ref NotificacionesTopic
      Tags:
        Project: MINGO
        Environment: !Ref Environment
        Owner: equipo-mingo
        ManagedBy: sam
        CostCenter: academico

  RecordatoriosSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${AWS::StackName}-recordatorios-horarios'
      Description: Recordatorios academicos de MINGO, una vez por hora en UTC.
      ScheduleExpression: !Ref RecordatorioCron
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      # En desarrollo queda deshabilitado; las reglas de AWS lo exigen.
      State: !If [IsProd, ENABLED, DISABLED]
      Target:
        Arn: !GetAtt RecordatoriosFunction.Arn
        RoleArn: !Ref SchedulerInvocationRoleArn
        # Sin reintentos: evita bucles y gasto accidental.
        RetryPolicy:
          MaximumRetryAttempts: 0
      # AWS::Scheduler::Schedule no admite Tags en CloudFormation. Las etiquetas
      # obligatorias las llevan la funcion y el log group asociados al schedule.

  # --- API HTTP (Express en Lambda) ------------------------------------------
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: !If [IsProd, 30, 7]
      Tags:
        - { Key: Project, Value: MINGO }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: equipo-mingo }
        - { Key: ManagedBy, Value: sam }
        - { Key: CostCenter, Value: academico }

  ApiHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      Description: API publica de MINGO. La autorizacion la aplica Express con Supabase.
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: MINGO API
          version: '1.0.0'
        paths: {}
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
      Tags:
        Project: MINGO
        Environment: !Ref Environment
        Owner: equipo-mingo
        ManagedBy: sam
        CostCenter: academico

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Description: API REST de MINGO servida por Express con serverless-http.
      CodeUri: ../backend/
      Handler: src/lambda/api.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 30
      # Igual que el worker: sin concurrencia reservada en dev (cuenta compartida).
      ReservedConcurrentExecutions: !If [IsProd, !Ref ApiConcurrency, !Ref AWS::NoValue]
      # El rol lo crea el usuario; MINGO solo lo referencia.
      Role: !Ref ApiRoleArn
      Environment:
        Variables:
          NODE_ENV: production
          API_PREFIX: /api
          CORS_ORIGINS: !Ref CorsOrigins
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_ANON_KEY: !Ref SupabaseAnonKey
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          AWS_S3_BUCKET: !Ref DocumentosBucket
          AWS_SQS_QUEUE_URL: !Ref ProcesamientoQueue
          AWS_SNS_TOPIC_ARN: !Ref NotificacionesTopic
          AWS_LAMBDA_FUNCTION_NAME: !Ref ProcesadorFunction
          AI_PROVIDER: !Ref AiProvider
          AI_API_KEY: !Ref AiApiKey
          AI_BASE_URL: !Ref AiBaseUrl
          AI_EMBEDDING_MODEL: !Ref AiEmbeddingModel
          AI_EMBEDDING_DIMENSIONS: !Ref AiEmbeddingDimensions
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiHttpApi
            Path: /{proxy+}
            Method: ANY
      Tags:
        Project: MINGO
        Environment: !Ref Environment
        Owner: equipo-mingo
        ManagedBy: sam
        CostCenter: academico

Outputs:
  BucketName:
    Description: Nombre del bucket de documentos.
    Value: !Ref DocumentosBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  BucketArn:
    Description: ARN del bucket de documentos.
    Value: !GetAtt DocumentosBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BucketArn'

  BucketRegion:
    Description: Region donde vive el bucket.
    Value: !Ref AWS::Region

  ProcessingQueueUrl:
    Description: URL de la cola de procesamiento.
    Value: !Ref ProcesamientoQueue
    Export:
      Name: !Sub '${AWS::StackName}-ProcessingQueueUrl'

  ProcessingQueueArn:
    Description: ARN de la cola de procesamiento.
    Value: !GetAtt ProcesamientoQueue.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ProcessingQueueArn'

  DeadLetterQueueUrl:
    Description: URL de la cola de mensajes fallidos.
    Value: !Ref ProcesamientoDeadLetterQueue
    Export:
      Name: !Sub '${AWS::StackName}-DeadLetterQueueUrl'

  ProcessorFunctionName:
    Description: Nombre de la Lambda procesadora.
    Value: !Ref ProcesadorFunction
    Export:
      Name: !Sub '${AWS::StackName}-ProcessorFunctionName'

  NotificacionesTopicArn:
    Description: ARN del topic SNS de notificaciones (HU18).
    Value: !Ref NotificacionesTopic
    Export:
      Name: !Sub '${AWS::StackName}-NotificacionesTopicArn'

  RecordatoriosFunctionName:
    Description: Nombre de la Lambda de recordatorios (HU18).
    Value: !Ref RecordatoriosFunction
    Export:
      Name: !Sub '${AWS::StackName}-RecordatoriosFunctionName'

  RecordatoriosScheduleState:
    Description: Estado del schedule unico de recordatorios.
    Value: !If [IsProd, ENABLED, DISABLED]

  ApiId:
    Description: ID de la API Gateway HTTP API.
    Value: !Ref ApiHttpApi
    Export:
      Name: !Sub '${AWS::StackName}-ApiId'

  ApiInvokeUrl:
    Description: URL de invocacion de la API (CloudFront hace proxy en /api/*).
    Value: !Sub 'https://${ApiHttpApi}.execute-api.${AWS::Region}.amazonaws.com'

  ApiFunctionName:
    Description: Nombre de la Lambda de la API.
    Value: !Ref ApiFunction
